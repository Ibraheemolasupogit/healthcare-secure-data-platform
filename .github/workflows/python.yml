name: Python quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src tests
      - run: pytest --cov --cov-report=term-missing
      - run: healthcare-platform governance validate-registry
      - run: healthcare-platform deployment validate
      - run: healthcare-platform recovery validate-registry
      - run: healthcare-platform operations validate-registry
      - run: healthcare-platform interoperability validate-fhir --input-dir data/samples/interoperability/fhir
      - run: healthcare-platform interoperability validate-hl7 --input-dir data/samples/interoperability/hl7
      - name: Expected FHIR failures
        run: |
          if healthcare-platform interoperability validate-fhir \
            --input-dir data/negative_tests/interoperability/fhir; then
            exit 1
          fi
      - name: Expected HL7 failures
        run: |
          if healthcare-platform interoperability validate-hl7 \
            --input-dir data/negative_tests/interoperability/hl7; then
            exit 1
          fi
