name: SQL lint

on:
  pull_request:
    paths: ["snowflake/**", "src/**", ".sqlfluff", ".github/workflows/sql.yml"]
  push:
    branches: [main]
    paths: ["snowflake/**", "src/**", ".sqlfluff", ".github/workflows/sql.yml"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "sqlfluff>=3.1,<4"
      - run: python -m pip install -e .
      - run: healthcare-platform snowflake-validate
      - run: sqlfluff lint snowflake --dialect snowflake
