name: Terraform validation

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - "snowflake/config/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
      - "snowflake/config/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to statically validate or plan-contract check"
        required: true
        default: "dev"
        type: choice
        options: ["dev", "test", "prod"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, test, prod]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: terraform fmt -check -recursive infrastructure/terraform
      - working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false
      - working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform validate
      - run: healthcare-platform deployment validate-plan-metadata
