services:
  dev:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      HEALTHCARE_PLATFORM_ENV: local
      HEALTHCARE_PLATFORM_EXECUTION_MODE: docker
    command: make validate
  airflow-init:
    profiles: ["airflow"]
    image: apache/airflow:2.9.3-python3.11
    user: "${AIRFLOW_UID:-50000}:0"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - airflow_metadata:/opt/airflow
      - ./outputs/orchestration:/workspace/outputs/orchestration
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /workspace/orchestration/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      HEALTHCARE_PLATFORM_ENV: local
      HEALTHCARE_AIRFLOW_EXECUTION_MODE: fixture
      HEALTHCARE_AIRFLOW_REPOSITORY_ROOT: /workspace
      HEALTHCARE_AIRFLOW_OUTPUT_ROOT: outputs/orchestration
      HEALTHCARE_AIRFLOW_CONNECTED_SNOWFLAKE: "false"
      HEALTHCARE_AIRFLOW_ENABLE_NOTIFICATIONS: "false"
      PYTHONPATH: /workspace/src:/workspace/orchestration/airflow/include
    command: >
      bash -c "python -m pip install --no-cache-dir -r requirements-dev.txt
      && python -m pip install --no-cache-dir -r requirements-airflow.txt
      && python -m pip install -e .
      && airflow db migrate"
  airflow-webserver:
    profiles: ["airflow"]
    image: apache/airflow:2.9.3-python3.11
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID:-50000}:0"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - airflow_metadata:/opt/airflow
      - ./outputs/orchestration:/workspace/outputs/orchestration
    ports:
      - "8080:8080"
    environment: *airflow_env
    command: airflow webserver
    healthcheck:
      test: ["CMD-SHELL", "airflow db check"]
      interval: 30s
      timeout: 10s
      retries: 5
  airflow-scheduler:
    profiles: ["airflow"]
    image: apache/airflow:2.9.3-python3.11
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID:-50000}:0"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - airflow_metadata:/opt/airflow
      - ./outputs/orchestration:/workspace/outputs/orchestration
    environment: *airflow_env
    command: airflow scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  airflow_metadata:
