version: 2
models:
  - name: billing_exception
    description: M8 governed billing/finance model `billing_exception`. Grain is the source-aligned business
      obj.
    config:
      contract:
        enforced: true
    meta:
      owner: analytics engineering
      milestone: '8'
      layer: curated_billing_finance
      sensitivity: synthetic_financial_restricted
      contract_status: declared_not_runtime_proven
      model_grain: documented in model description
    columns:
      - name: billing_exception_key
        data_type: varchar
        description: Stable SHA-256 surrogate key `billing_exception_key`.
        data_tests:
          - not_null
          - valid_sha256
      - name: source_record_id
        data_type: varchar
        description: Source lineage record identifier.
      - name: source_relation
        data_type: varchar
        description: Upstream source/staging relation.
      - name: source_system
        data_type: varchar
        description: Source system label.
      - name: synthetic_flag
        data_type: boolean
        description: Synthetic-only marker.
      - name: dbt_updated_at
        data_type: timestamp_tz
        description: dbt model update timestamp.
