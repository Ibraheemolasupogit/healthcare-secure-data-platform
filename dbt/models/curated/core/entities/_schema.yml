version: 2
models:
  - name: core_patient_identity
    description: 'Authoritative deterministic synthetic patient identity crosswalk. Grain is one source
      patient identifier per namespace and canonical synthetic patient.

      '
    config:
      contract:
        enforced: true
    meta: &id001
      owner: analytics engineering
      milestone: '6'
      layer: curated_core
      sensitivity: synthetic_restricted
      contract_status: declared_not_runtime_proven
      historical_behaviour: current_source_identity_mapping
      future_downstream_consumers:
        - milestone_7_plus
    columns:
      - name: patient_identity_key
        data_type: varchar
        description: Stable identity-row surrogate key.
        data_tests:
          - not_null
          - unique
          - valid_sha256
      - name: patient_key
        data_type: varchar
        description: Stable conformed patient key.
        data_tests:
          - valid_sha256
      - name: canonical_patient_id
        data_type: varchar
        description: Canonical synthetic patient identifier.
      - name: source_namespace
        data_type: varchar
        description: Source namespace for the patient identifier.
        data_tests:
          - not_null
      - name: source_patient_identifier
        data_type: varchar
        description: Source patient identifier.
        data_tests:
          - not_null
      - name: source_record_id
        data_type: varchar
        description: Source lineage record identifier.
      - name: source_relation
        data_type: varchar
        description: Upstream staging or intermediate relation.
      - name: source_system
        data_type: varchar
        description: Source system label.
      - name: source_updated_at
        data_type: timestamp_tz
        description: Source update timestamp where available.
      - name: mapping_version
        data_type: varchar
        description: Mapping rule or parser version.
      - name: mapping_status
        data_type: varchar
        description: Deterministic mapping status.
      - name: is_unmatched
        data_type: boolean
        description: Whether the identifier did not resolve to a canonical patient.
      - name: is_conflicting
        data_type: boolean
        description: Whether the identifier had conflicting mappings.
      - name: dbt_updated_at
        data_type: timestamp_tz
        description: dbt model update timestamp.
  - name: core_patient
    description: 'Authoritative conformed synthetic patient. Grain is one row per canonical synthetic
      patient.

      '
    config:
      contract:
        enforced: true
    meta: *id001
    columns:
      - name: patient_key
        data_type: varchar
        description: Stable SHA-256 patient surrogate key.
        data_tests:
          - not_null
          - unique
          - valid_sha256
      - name: canonical_patient_id
        data_type: varchar
        description: Canonical synthetic patient identifier.
        data_tests:
          - not_null
          - unique
          - valid_synthetic_identifier:
              prefix: PAT
      - name: patient_pseudonym
        data_type: varchar
        description: Synthetic pseudonym.
      - name: synthetic_nhs_number
        data_type: varchar
        description: Synthetic NHS-like identifier; not a real NHS number.
      - name: birth_date
        data_type: date
        description: Synthetic birth date.
      - name: sex_code
        data_type: varchar
        description: Synthetic sex code.
      - name: ethnicity_code
        data_type: varchar
        description: Synthetic ethnicity code.
      - name: postcode_sector
        data_type: varchar
        description: Synthetic postcode sector.
      - name: registered_gp_organisation_key
        data_type: varchar
        description: Registered GP organisation surrogate key.
      - name: registered_gp_organisation_id
        data_type: varchar
        description: Registered GP source organisation identifier.
      - name: deceased_flag
        data_type: boolean
        description: Synthetic deceased flag.
      - name: death_date
        data_type: date
        description: Synthetic death date when present.
      - name: research_consent_status
        data_type: varchar
        description: Current research consent summary.
        data_tests:
          - accepted_values:
              values:
                - ACTIVE
                - NOT_ACTIVE
      - name: valid_from
        data_type: timestamp_tz
        description: Effective start from source record creation.
      - name: valid_to
        data_type: timestamp_tz
        description: Effective end; null for current record.
      - name: is_current
        data_type: boolean
        description: Current-record flag.
      - name: source_system_count
        data_type: number
        description: Count of contributing source namespaces.
      - name: source_record_count
        data_type: number
        description: Count of contributing source records.
      - name: source_first_seen_at
        data_type: timestamp_tz
        description: Earliest contributing source timestamp.
      - name: source_last_seen_at
        data_type: timestamp_tz
        description: Latest contributing source timestamp.
      - name: source_record_id
        data_type: varchar
        description: Staging source record ID.
      - name: source_relation
        data_type: varchar
        description: Upstream staging relation.
      - name: source_system
        data_type: varchar
        description: Source system label.
      - name: synthetic_flag
        data_type: boolean
        description: Synthetic-only flag.
      - name: dbt_updated_at
        data_type: timestamp_tz
        description: dbt model update timestamp.
