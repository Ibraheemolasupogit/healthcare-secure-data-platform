    description: M8 governed billing/finance model `finance_daily_control`. Grain is the source-aligned
      business.
    config:
      contract:
        enforced: true
    meta:
      owner: analytics engineering
      milestone: '8'
      layer: curated_billing_finance
      sensitivity: synthetic_financial_restricted
      contract_status: declared_not_runtime_proven
      model_grain: documented in model description
    columns:
      - name: finance_control_key
        data_type: varchar
        description: Stable SHA-256 surrogate key `finance_control_key`.
        data_tests:
          - not_null
          - valid_sha256
      - name: source_record_id
        data_type: varchar
        description: Source lineage record identifier.
      - name: source_relation
        data_type: varchar
        description: Upstream source/staging relation.
      - name: source_system
        data_type: varchar
        description: Source system label.
      - name: synthetic_flag
        data_type: boolean
        description: Synthetic-only marker.
