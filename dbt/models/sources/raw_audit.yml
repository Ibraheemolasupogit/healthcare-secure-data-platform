version: 2
sources:
  - name: raw_audit
    database: '{{ var(''raw_audit_database'', ''HEDP_DEV_RAW'') }}'
    schema: '{{ var(''raw_audit_schema'', ''AUDIT'') }}'
    description: 'Raw Audit source group declared by Milestone 5. Relations are source-aligned raw contracts;
      dbt does not own raw loading.

      '
    meta:
      owner: platform audit engineering
      loader: SYNTHETIC_MILESTONE_2_OR_INTEROP
      implementation_status: local_fixture_static_contract
      contract_status: source_contract
      source_system: synthetic_healthcare_platform
      contains_real_patient_data: false
    tables:
      - name: audit_events
        identifier: AUDIT_EVENTS
        description: 'Synthetic platform audit activity.

          '
        loaded_at_field: event_datetime
        freshness:
          warn_after:
            count: 12
            period: hour
          error_after:
            count: 24
            period: hour
        meta:
          owner: platform audit engineering
          sensitivity: synthetic_restricted
          primary_key: audit_event_id
          source_system: synthetic
          schema_version: 1.0.0
          implementation_status: local_fixture_static_contract
          contract_status: declared
          milestone_owner: milestone_5
        data_tests:
          - unique_combination_of_columns:
              combination_of_columns:
                - audit_event_id
        columns:
          - name: audit_event_id
            data_type: varchar
            description: 'Source column `audit_event_id` preserved from the existing audit_events contract.

              '
            data_tests:
              - not_null
          - name: actor_id
            data_type: varchar
            description: 'Source column `actor_id` preserved from the existing audit_events contract.

              '
          - name: actor_role
            data_type: varchar
            description: 'Source column `actor_role` preserved from the existing audit_events contract.

              '
          - name: action
            data_type: varchar
            description: 'Source column `action` preserved from the existing audit_events contract.

              '
          - name: object_type
            data_type: varchar
            description: 'Source column `object_type` preserved from the existing audit_events contract.

              '
          - name: object_id
            data_type: varchar
            description: 'Source column `object_id` preserved from the existing audit_events contract.

              '
          - name: event_datetime
            data_type: timestamp_tz
            description: 'Source column `event_datetime` preserved from the existing audit_events contract.

              '
          - name: outcome
            data_type: varchar
            description: 'Source column `outcome` preserved from the existing audit_events contract.

              '
          - name: source_component
            data_type: varchar
            description: 'Source column `source_component` preserved from the existing audit_events contract.

              '
          - name: environment
            data_type: varchar
            description: 'Source column `environment` preserved from the existing audit_events contract.

              '
          - name: correlation_id
            data_type: varchar
            description: 'Source column `correlation_id` preserved from the existing audit_events contract.

              '
      - name: ingestion_envelopes
        identifier: INGESTION_ENVELOPES
        description: 'Source-neutral Milestone 4 ingestion envelope audit records.

          '
        loaded_at_field: received_timestamp
        freshness:
          warn_after:
            count: 12
            period: hour
          error_after:
            count: 24
            period: hour
        meta:
          owner: platform audit engineering
          sensitivity: synthetic_restricted
          primary_key: ingestion_id
          source_system: synthetic
          schema_version: 1.0.0
          implementation_status: local_fixture_static_contract
          contract_status: declared
          milestone_owner: milestone_5
        data_tests:
          - unique_combination_of_columns:
              combination_of_columns:
                - ingestion_id
        columns:
          - name: ingestion_id
            data_type: varchar
            description: 'Source column `ingestion_id` preserved from the existing ingestion_envelopes
              contract.

              '
            data_tests:
              - not_null
          - name: batch_id
            data_type: varchar
            description: 'Source column `batch_id` preserved from the existing ingestion_envelopes contract.

              '
          - name: source_format
            data_type: varchar
            description: 'Source column `source_format` preserved from the existing ingestion_envelopes
              contract.

              '
            data_tests:
              - not_null
              - accepted_values:
                  values:
                    - FHIR
                    - HL7V2
          - name: source_system
            data_type: varchar
            description: 'Source column `source_system` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: source_record_id
            data_type: varchar
            description: 'Source column `source_record_id` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: source_message_type
            data_type: varchar
            description: 'Source column `source_message_type` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: source_patient_id
            data_type: varchar
            description: 'Source column `source_patient_id` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: source_encounter_id
            data_type: varchar
            description: 'Source column `source_encounter_id` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: canonical_patient_id
            data_type: varchar
            description: 'Source column `canonical_patient_id` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: canonical_encounter_id
            data_type: varchar
            description: 'Source column `canonical_encounter_id` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: canonical_mapping_status
            data_type: varchar
            description: 'Source column `canonical_mapping_status` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: validation_status
            data_type: varchar
            description: 'Source column `validation_status` preserved from the existing ingestion_envelopes
              contract.

              '
            data_tests:
              - accepted_values:
                  values:
                    - ACCEPTED
                    - ACCEPTED_WITH_WARNINGS
                    - REJECTED
                    - UNSUPPORTED
          - name: validation_error_count
            data_type: varchar
            description: 'Source column `validation_error_count` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: warning_count
            data_type: varchar
            description: 'Source column `warning_count` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: payload_checksum
            data_type: varchar
            description: 'Source column `payload_checksum` preserved from the existing ingestion_envelopes
              contract.

              '
            data_tests:
              - not_null
              - valid_sha256
          - name: raw_payload_path
            data_type: varchar
            description: 'Source column `raw_payload_path` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: correlation_id
            data_type: varchar
            description: 'Source column `correlation_id` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: event_timestamp
            data_type: varchar
            description: 'Source column `event_timestamp` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: received_timestamp
            data_type: varchar
            description: 'Source column `received_timestamp` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: parser_version
            data_type: varchar
            description: 'Source column `parser_version` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: schema_version
            data_type: varchar
            description: 'Source column `schema_version` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: payload_version
            data_type: varchar
            description: 'Source column `payload_version` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: environment
            data_type: varchar
            description: 'Source column `environment` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: quarantine_flag
            data_type: varchar
            description: 'Source column `quarantine_flag` preserved from the existing ingestion_envelopes
              contract.

              '
          - name: synthetic_flag
            data_type: varchar
            description: 'Source column `synthetic_flag` preserved from the existing ingestion_envelopes
              contract.

              '
            data_tests:
              - not_null
              - accepted_values:
                  values:
                    - true
