version: 2
sources:
  - name: raw_clinical
    database: '{{ var(''raw_clinical_database'', ''HEDP_DEV_RAW'') }}'
    schema: '{{ var(''raw_clinical_schema'', ''CLINICAL'') }}'
    description: 'Raw Clinical source group declared by Milestone 5. Relations are source-aligned raw
      contracts; dbt does not own raw loading.

      '
    meta:
      owner: clinical platform engineering
      loader: SYNTHETIC_MILESTONE_2
      implementation_status: local_fixture_planned_raw
      contract_status: source_contract
      source_system: synthetic_healthcare_platform
      contains_real_patient_data: false
    tables:
      - name: admissions
        identifier: ADMISSIONS
        description: 'Synthetic inpatient admission and discharge episodes.

          '
        loaded_at_field: updated_at
        freshness:
          warn_after:
            count: 12
            period: hour
          error_after:
            count: 36
            period: hour
        meta:
          owner: clinical platform engineering
          sensitivity: synthetic_restricted
          primary_key: admission_id
          source_system: synthetic
          schema_version: 1.0.0
          implementation_status: local_fixture_planned_raw
          contract_status: declared
          milestone_owner: milestone_5
        data_tests:
          - unique_combination_of_columns:
              combination_of_columns:
                - admission_id
        columns:
          - name: admission_id
            data_type: varchar
            description: 'Source column `admission_id` preserved from the existing admissions contract.

              '
            data_tests:
              - not_null
          - name: encounter_id
            data_type: varchar
            description: 'Source column `encounter_id` preserved from the existing admissions contract.

              '
          - name: patient_id
            data_type: varchar
            description: 'Source column `patient_id` preserved from the existing admissions contract.

              '
          - name: admission_datetime
            data_type: timestamp_tz
            description: 'Source column `admission_datetime` preserved from the existing admissions contract.

              '
          - name: discharge_datetime
            data_type: timestamp_tz
            description: 'Source column `discharge_datetime` preserved from the existing admissions contract.

              '
          - name: admission_method
            data_type: varchar
            description: 'Source column `admission_method` preserved from the existing admissions contract.

              '
          - name: discharge_method
            data_type: varchar
            description: 'Source column `discharge_method` preserved from the existing admissions contract.

              '
          - name: ward_id
            data_type: varchar
            description: 'Source column `ward_id` preserved from the existing admissions contract.

              '
          - name: length_of_stay_days
            data_type: number
            description: 'Source column `length_of_stay_days` preserved from the existing admissions contract.

              '
          - name: readmission_flag
            data_type: boolean
            description: 'Source column `readmission_flag` preserved from the existing admissions contract.

              '
          - name: prior_admission_id
            data_type: varchar
            description: 'Source column `prior_admission_id` preserved from the existing admissions contract.

              '
          - name: updated_at
            data_type: timestamp_tz
            description: 'Source column `updated_at` preserved from the existing admissions contract.

              '
