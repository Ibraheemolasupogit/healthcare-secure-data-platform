            description: Source column `outstanding_amount` preserved from the M7 outstanding_balances
              contract.
          - name: ageing_bucket
            data_type: varchar
            description: Source column `ageing_bucket` preserved from the Milestone 7 outstanding_balances
              contract.
          - name: currency
            data_type: varchar
            description: Source column `currency` preserved from the Milestone 7 outstanding_balances
              contract.
            data_tests:
              - accepted_values:
