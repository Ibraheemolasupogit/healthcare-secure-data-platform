version: 2
sources:
  - name: raw_operational
    database: '{{ var(''raw_operational_database'', ''HEDP_DEV_RAW'') }}'
    schema: '{{ var(''raw_operational_schema'', ''OPERATIONAL'') }}'
    description: 'Raw Operational source group declared by Milestone 5. Relations are source-aligned raw
      contracts; dbt does not own raw loading.

      '
    meta:
      owner: operational platform engineering
      loader: SYNTHETIC_MILESTONE_2
      implementation_status: local_fixture_planned_raw
      contract_status: source_contract
      source_system: synthetic_healthcare_platform
      contains_real_patient_data: false
    tables:
      - name: appointments
        identifier: APPOINTMENTS
        description: 'Synthetic outpatient appointments.

          '
        loaded_at_field: updated_at
        freshness:
          warn_after:
            count: 12
            period: hour
          error_after:
            count: 36
            period: hour
        meta:
          owner: operational platform engineering
          sensitivity: synthetic_restricted
          primary_key: appointment_id
          source_system: synthetic
          schema_version: 1.0.0
          implementation_status: local_fixture_planned_raw
          contract_status: declared
          milestone_owner: milestone_5
        data_tests:
          - unique_combination_of_columns:
              combination_of_columns:
                - appointment_id
        columns:
          - name: appointment_id
            data_type: varchar
            description: 'Source column `appointment_id` preserved from the existing appointments contract.

              '
            data_tests:
              - not_null
          - name: patient_id
            data_type: varchar
            description: 'Source column `patient_id` preserved from the existing appointments contract.

              '
          - name: organisation_id
            data_type: varchar
            description: 'Source column `organisation_id` preserved from the existing appointments contract.

              '
          - name: location_id
            data_type: varchar
            description: 'Source column `location_id` preserved from the existing appointments contract.

              '
          - name: provider_id
            data_type: varchar
            description: 'Source column `provider_id` preserved from the existing appointments contract.

              '
          - name: appointment_datetime
            data_type: timestamp_tz
            description: 'Source column `appointment_datetime` preserved from the existing appointments
              contract.

              '
          - name: booking_datetime
            data_type: timestamp_tz
            description: 'Source column `booking_datetime` preserved from the existing appointments contract.

              '
          - name: appointment_type
            data_type: varchar
            description: 'Source column `appointment_type` preserved from the existing appointments contract.

              '
          - name: attendance_status
            data_type: varchar
            description: 'Source column `attendance_status` preserved from the existing appointments contract.

              '
          - name: cancellation_reason
            data_type: varchar
            description: 'Source column `cancellation_reason` preserved from the existing appointments
              contract.

              '
          - name: referral_id
            data_type: varchar
            description: 'Source column `referral_id` preserved from the existing appointments contract.

              '
          - name: updated_at
            data_type: timestamp_tz
            description: 'Source column `updated_at` preserved from the existing appointments contract.

              '
