version: 1.0.0
retention_policies:
  - retention_policy_id: ret_raw_synthetic_clinical
    data_class: SYNTHETIC_HEALTH_CONFIDENTIAL
    retention_period: symbolic_short_lived_raw
    trigger: source_landing
    archival_expectation: none_for_local_portfolio
    deletion_expectation: manual_review_only_no_auto_delete
    legal_hold_override: documented_not_implemented
    owner: PLATFORM_OWNER
    review_cadence: quarterly
    environments: [DEV, TEST, PROD]
    implementation_status: DOCUMENTED
    limitations: Not a legal retention requirement.
