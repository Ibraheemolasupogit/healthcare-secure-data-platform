runbooks:
  - runbook_id: rb_pipeline_failure
    trigger: PIPELINE_FAILURE
    owner: DATA_ENGINEERING
    prerequisites: [governance_registry_available, local_run_manifest_available]
    diagnostic_steps:
      - Inspect DAG and task dependency metadata.
      - Confirm connected execution remains disabled by default.
    containment: Pause promotion of affected data products.
    recovery_steps: Re-run local validation after metadata fix.
    validation: pipeline_health_checks_return_HEALTHY
    escalation: PLATFORM_ENGINEERING
    rollback: Use Milestone 15 rollback reference if release metadata is affected.
    evidence: operations/reference/incident_simulation.json
    limitations: Local runbook only; no production automation.
    execution_status: local_guidance_only
  - runbook_id: rb_stale_data
    trigger: DATA_FRESHNESS
    owner: DATA_ENGINEERING
    prerequisites: [freshness_metadata_available]
    diagnostic_steps:
      - Compare synthetic freshness delay with SLO target.
      - Identify upstream stale dependency.
    containment: Label affected data product DEGRADED.
    recovery_steps: Refresh metadata fixture or block promotion.
    validation: freshness_health_checks_return_HEALTHY
    escalation: ANALYTICS_ENGINEERING
    rollback: Not applicable to local freshness metadata.
    evidence: operations/reference/health_report.json
    limitations: No live source freshness is queried.
    execution_status: local_guidance_only
  - runbook_id: rb_dbt_contract_failure
    trigger: CONTRACT_FAILURE
    owner: ANALYTICS_ENGINEERING
    prerequisites: [dbt_parse_metadata_available]
    diagnostic_steps:
      - Inspect parse and schema contract evidence.
      - Identify changed model or source contract.
    containment: Block affected model promotion.
    recovery_steps: Restore compatible contract or update downstream metadata.
    validation: dbt_parse_and_contract_checks_pass
    escalation: DATA_GOVERNANCE
    rollback: Use release rollback reference when caused by promotion.
    evidence: operations/reference/incident_simulation.json
    limitations: No live dbt job is executed by the runbook.
    execution_status: local_guidance_only
  - runbook_id: rb_reconciliation_control_failure
    trigger: BILLING_CONTROL
    owner: REVENUE_ASSURANCE
    prerequisites: [assurance_rules_available]
    diagnostic_steps:
      - Inspect failed reconciliation-control metadata.
      - Confirm exception severity and owner.
    containment: Mark finance assurance output DEGRADED.
    recovery_steps: Resolve control input or accept documented risk.
    validation: reconciliation_control_pass_rate_within_target
    escalation: FINANCE_ANALYTICS
    rollback: Not automatic; release rollback follows Milestone 15.
    evidence: operations/reference/post_incident_review.md
    limitations: Synthetic assurance data only.
    execution_status: local_guidance_only
  - runbook_id: rb_governance_checksum_mismatch
    trigger: ACCESS_CONTROL
    owner: DATA_GOVERNANCE
    prerequisites: [governance_reference_checksums_available]
    diagnostic_steps:
      - Verify policy checksum mismatch source.
      - Confirm no sensitive payload is embedded in evidence.
    containment: Fail closed until policy integrity is restored.
    recovery_steps: Regenerate governance evidence from trusted registry.
    validation: governance_checksum_and_policy_resolution_pass
    escalation: SECURITY_OPERATIONS
    rollback: Restore last accepted governance registry version.
    evidence: operations/reference/incident_simulation.json
    limitations: Does not alter live access controls.
    execution_status: local_guidance_only
  - runbook_id: rb_feature_freshness_failure
    trigger: FEATURE_FRESHNESS
    owner: DATA_SCIENCE
    prerequisites: [feature_registry_available]
    diagnostic_steps:
      - Inspect freshness and point-in-time metadata.
      - Identify stale feature consumers.
    containment: Mark affected feature consumers DEGRADED.
    recovery_steps: Rebuild local reference output after owner review.
    validation: feature_freshness_rate_within_target
    escalation: FEATURE_STORE_OWNER
    rollback: Restore accepted feature registry version.
    evidence: operations/reference/health_report.json
    limitations: Offline feature fixtures only.
    execution_status: local_guidance_only
  - runbook_id: rb_model_output_validation_failure
    trigger: MODEL_GOVERNANCE
    owner: DATA_SCIENCE
    prerequisites: [model_card_and_prediction_contract_available]
    diagnostic_steps:
      - Inspect model card completeness.
      - Validate prediction-output contract metadata.
    containment: Block model promotion or scoring package acceptance.
    recovery_steps: Correct contract or model-card metadata.
    validation: model_output_validation_rate_within_target
    escalation: DATA_GOVERNANCE
    rollback: Restore accepted model registry version.
    evidence: operations/reference/incident_simulation.json
    limitations: No live model endpoint is invoked.
    execution_status: local_guidance_only
  - runbook_id: rb_powerbi_refresh_failure
    trigger: SEMANTIC_REFRESH
    owner: BI_ANALYTICS
    prerequisites: [semantic_model_manifest_available]
    diagnostic_steps:
      - Inspect semantic model and refresh metadata.
      - Confirm RLS/OLS metadata remains intact.
    containment: Disable refresh acceptance in local metadata.
    recovery_steps: Restore semantic model contract or report specification.
    validation: semantic_refresh_success_rate_within_target
    escalation: ANALYTICS_ENGINEERING
    rollback: Restore accepted semantic model reference output.
    evidence: operations/reference/health_report.json
    limitations: No Fabric or Power BI API call is made.
    execution_status: local_guidance_only
  - runbook_id: rb_deployment_drift
    trigger: DEPLOYMENT_DRIFT
    owner: PLATFORM_ENGINEERING
    prerequisites: [deployment_drift_report_available]
    diagnostic_steps:
      - Inspect drift report and deployment manifest.
      - Confirm rollback reference exists.
    containment: Block promotion until drift disposition is recorded.
    recovery_steps: Regenerate plan metadata or rollback per Milestone 15.
    validation: deployment_validation_success_within_target
    escalation: RELEASE_MANAGER
    rollback: Milestone 15 rollback plan.
    evidence: deployment/reference/drift_report.json
    limitations: No live Terraform apply is executed.
    execution_status: local_guidance_only
  - runbook_id: rb_recovery_readiness_failure
    trigger: RECOVERY_READINESS
    owner: RECOVERY_COORDINATION
    prerequisites: [recovery_registry_and_evidence_available]
    diagnostic_steps:
      - Validate recovery registry.
      - Inspect recovery evidence checksums.
    containment: Block recovery-readiness claim.
    recovery_steps: Restore Milestone 16 evidence integrity.
    validation: recovery_readiness_rate_within_target
    escalation: PLATFORM_ENGINEERING
    rollback: Restore accepted recovery registry and evidence.
    evidence: recovery/reference/recovery_validation_report.json
    limitations: No live failover is executed.
    execution_status: local_guidance_only
  - runbook_id: rb_evidence_checksum_failure
    trigger: EVIDENCE_INTEGRITY
    owner: PLATFORM_ENGINEERING
    prerequisites: [checksum_manifest_available]
    diagnostic_steps:
      - Recompute local checksums.
      - Identify changed or missing evidence file.
    containment: Reject evidence pack until checksum mismatch is resolved.
    recovery_steps: Regenerate deterministic evidence after owner approval.
    validation: checksum_verification_passes
    escalation: DATA_GOVERNANCE
    rollback: Restore last accepted evidence bundle.
    evidence: operations/reference/checksums.sha256
    limitations: Local evidence only.
    execution_status: local_guidance_only
  - runbook_id: rb_regional_recovery_drill
    trigger: RECOVERY_READINESS
    owner: RECOVERY_COORDINATION
    prerequisites: [manual_approval, recovery_registry_available]
    diagnostic_steps:
      - Load Milestone 16 recovery sequence.
      - Verify governance and deployment controls first.
    containment: Keep drill local and synthetic.
    recovery_steps: Simulate recovery ordering and validate RTO/RPO metadata.
    validation: drill_status_DRILL_PASSED_or_READY_WITH_APPROVAL
    escalation: PLATFORM_ENGINEERING
    rollback: No live rollback; simulation reset only.
    evidence: operations/reference/drill_simulation.json
    limitations: No live failover, failback, DNS, account or cloud action.
    execution_status: local_simulation_only
drills:
