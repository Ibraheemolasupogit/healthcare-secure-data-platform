simulation_scenarios:
  incident:
    scenario_id: governance_checksum_mismatch
    category: ACCESS_CONTROL
    affected_services: [governance_registry, cicd_controls, recovery_evidence_service]
    failed_checks: [chk_governance_registry_checksum]
    duration_minutes: 35
    data_sensitivity: RESTRICTED
    financial_value_at_risk: low
    user_facing_impact: medium
    recovery_readiness: blocked
    expected_severity: SEV_1_CRITICAL
    expected_route: route_access_control_critical
    expected_runbook: rb_governance_checksum_mismatch
    contains_patient_payload: false
    synthetic: true
  drill:
    scenario_id: primary_region_outage
    drill_id: drill_primary_region_outage
    failed_checks:
      - chk_snowflake_contract_available
      - chk_recovery_registry_valid
    affected_services:
      - snowflake_platform
      - dbt_staging
      - healthcare_core
      - recovery_evidence_service
    simulated_duration_minutes: 110
    recovery_point_age_minutes: 45
    expected_status: DRILL_READY_WITH_APPROVAL
    cloud_action_performed: false
    automatic_execution: false
    synthetic: true
