version: 1.0.0
milestone: 17
status: STATICALLY_VALIDATED
connected_status: NOT_CONNECTED
monitoring_status: LOCAL_SIMULATION_ONLY
alerting_status: DISABLED
incident_response_status: LOCAL_SIMULATION_ONLY
production_slo_commitment: false
automatic_remediation_enabled: false
automatic_production_drills_enabled: false
live_integrations:
  siem: disabled
  pagerduty: disabled
  slack: disabled
  teams: disabled
  email: disabled
  servicenow: disabled
  cloud_monitoring: disabled
limitations:
  - Synthetic telemetry only.
  - No live alerts, tickets, on-call paging, dashboards or cloud monitoring.
  - Synthetic SLO targets are not production commitments.
  - No clinical assurance or operational resilience certification is claimed.
health_model:
  states:
    - HEALTHY
    - DEGRADED
    - UNHEALTHY
    - UNKNOWN
    - MAINTENANCE
    - NOT_APPLICABLE
  precedence:
    - UNHEALTHY
    - DEGRADED
    - UNKNOWN
    - MAINTENANCE
    - HEALTHY
    - NOT_APPLICABLE
  inputs:
    - dependency_availability
    - freshness
    - data_quality
    - contract_status
    - job_status
    - control_status
    - drift_status
    - evidence_integrity
    - recovery_readiness
  live_health_claim: false
incident_lifecycle:
  states:
    - DETECTED
    - TRIAGED
    - ASSIGNED
    - INVESTIGATING
    - MITIGATING
    - MONITORING
    - RESOLVED
    - CLOSED
    - FALSE_POSITIVE
    - ACCEPTED_RISK
    - REOPENED
  transitions:
    DETECTED: [TRIAGED, FALSE_POSITIVE]
    TRIAGED: [ASSIGNED, ACCEPTED_RISK]
    ASSIGNED: [INVESTIGATING]
    INVESTIGATING: [MITIGATING, ACCEPTED_RISK]
    MITIGATING: [MONITORING]
    MONITORING: [RESOLVED, REOPENED]
    RESOLVED: [CLOSED, REOPENED]
    REOPENED: [INVESTIGATING]
    FALSE_POSITIVE: [CLOSED]
    ACCEPTED_RISK: [CLOSED, REOPENED]
    CLOSED: []
severity_model:
  levels:
    - severity_id: SEV_1_CRITICAL
      escalation_required: true
      affected_tiers:
        - TIER_0_CRITICAL_CONTROL_PLANE
        - TIER_1_CRITICAL_DATA_SERVICES
      blast_radius: platform_or_domain_wide
      governance_impact: critical
      user_facing_impact: high
    - severity_id: SEV_2_HIGH
      escalation_required: true
      affected_tiers:
        - TIER_1_CRITICAL_DATA_SERVICES
        - TIER_2_ANALYTICS_AND_ASSURANCE
      blast_radius: domain_or_multi_service
      governance_impact: high
      user_facing_impact: medium
    - severity_id: SEV_3_MEDIUM
      escalation_required: true
      affected_tiers:
        - TIER_2_ANALYTICS_AND_ASSURANCE
        - TIER_3_REPORTING_AND_ML
      blast_radius: service_or_product
      governance_impact: moderate
      user_facing_impact: low
    - severity_id: SEV_4_LOW
      escalation_required: false
      affected_tiers:
        - TIER_3_REPORTING_AND_ML
        - TIER_4_NON_CRITICAL_REFERENCE
      blast_radius: limited
      governance_impact: low
      user_facing_impact: minimal
    - severity_id: SEV_5_INFORMATIONAL
      escalation_required: false
      affected_tiers:
        - TIER_4_NON_CRITICAL_REFERENCE
      blast_radius: informational
      governance_impact: none
      user_facing_impact: none
  clinical_severity_claim: false
incident_categories:
  - DATA_FRESHNESS
  - DATA_QUALITY
  - CONTRACT_FAILURE
  - PIPELINE_FAILURE
  - ACCESS_CONTROL
  - SECURITY_EVENT
  - BILLING_CONTROL
  - MODEL_GOVERNANCE
  - FEATURE_FRESHNESS
  - SEMANTIC_REFRESH
  - DEPLOYMENT_DRIFT
  - RECOVERY_READINESS
  - EVIDENCE_INTEGRITY
  - CONFIGURATION_ERROR
services:
  - service_id: governance_registry
    name: Governance registry
    owner_role: DATA_GOVERNANCE_STEWARD
    business_owner_role: SECURITY_ADMIN
    recovery_tier: TIER_0_CRITICAL_CONTROL_PLANE
    criticality: critical
    dependencies: []
    environment: all
    health_checks:
      - chk_governance_registry_checksum
      - chk_governance_policy_resolution
      - chk_governance_sensitive_field_coverage
    sli_refs: [sli_governance_validation_success]
    slo_refs: [slo_governance_validation_100]
    runbook_refs: [rb_governance_checksum_mismatch]
    incident_routing_group: DATA_GOVERNANCE
    audit_event_ref: aud_policy_change
    lifecycle_status: active_metadata_contract
    synthetic_only: true
  - service_id: cicd_controls
