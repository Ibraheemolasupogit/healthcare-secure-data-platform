[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-secure-data-platform"
version = "0.2.0"
description = "Deterministic synthetic healthcare data tooling for a secure platform portfolio"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Healthcare Secure Data Platform contributors"}]
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
healthcare-platform = "healthcare_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
source = ["healthcare_platform"]
branch = true
